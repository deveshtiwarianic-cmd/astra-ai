<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<meta name="description" content="Astra 10 — multilingual AI assistant developed by Devesh Tiwari">
<title>Astra 10 — AI Assistant</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#07101f;--panel:#0c1729;--panel2:#101d32;--border:#203451;--text:#f7f9ff;--muted:#91a0b7;--accent:#6c63ff;--accent2:#1fd5ff;--user:#263b61;--danger:#ff657a;--good:#39df8b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea,select{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:270px;background:#06101e;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:12px;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;padding:4px 3px 12px}.brand img{width:42px;height:42px;border-radius:13px}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.newchat{width:100%;border:1px solid #3b4f72;background:linear-gradient(135deg,#172b4d,#10213a);color:#fff;border-radius:12px;padding:11px;font-weight:700}.history-title{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#697a95;padding:7px 4px}.history{overflow:auto;flex:1}.history button{width:100%;text-align:left;background:transparent;border:0;color:#bac6d8;padding:10px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover{background:#102038}.sidebottom{border-top:1px solid var(--border);padding-top:10px;display:grid;gap:6px}.sidebtn{background:transparent;border:0;color:#aebbd0;text-align:left;padding:10px;border-radius:9px}.sidebtn:hover{background:#102038}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px;background:#081426ee;backdrop-filter:blur(12px)}.topbrand{display:flex;align-items:center;gap:10px}.topbrand img{width:36px;height:36px;border-radius:11px}.topbrand b{font-size:16px}.topbrand span{font-size:11px;color:var(--muted)}.topactions{display:flex;gap:7px;align-items:center}.btn{border:1px solid var(--border);background:#0e1a2d;color:#dce5f4;border-radius:10px;padding:8px 10px}.btn:hover{background:#15253d}.btn.on{border-color:#2bce8b;color:#8cf4bd}.mobile-menu{display:none}.chat{flex:1;overflow:auto}.wrap{max-width:900px;margin:auto;padding:28px 18px 150px}.welcome{text-align:center;padding:6vh 0 25px}.hero-logo{width:78px;height:78px;border-radius:23px;box-shadow:0 0 40px #5e5cff44}.welcome h1{font-size:38px;margin:15px 0 7px;background:linear-gradient(90deg,#fff,#a8a2ff,#53e9ff);-webkit-background-clip:text;background-clip:text;color:transparent}.welcome p{color:var(--muted);margin:0}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px auto 0;max-width:680px}.chip{border:1px solid var(--border);background:#0d1a2d;color:#b9c7dc;border-radius:999px;padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:24px}.card{border:1px solid var(--border);background:linear-gradient(145deg,#0d192b,#0a1424);border-radius:15px;padding:15px;text-align:left;color:#e5ebf5}.card strong{display:block}.card small{display:block;color:var(--muted);margin-top:5px}.msg{display:flex;margin:20px 0;gap:10px;align-items:flex-start}.msg.user{justify-content:flex-end}.avatar{width:31px;height:31px;flex:0 0 31px;border-radius:10px;background:#15233a;display:grid;place-items:center;overflow:hidden}.avatar img{width:100%;height:100%}.msg.user .avatar{order:2}.bubble{max-width:min(760px,88%);padding:13px 15px;border-radius:17px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(135deg,#294570,#23395e);border-bottom-right-radius:5px}.assistant .bubble{background:#0d1829;border:1px solid var(--border);border-bottom-left-radius:5px}.typing{display:flex;gap:5px;padding:7px 2px}.typing i{width:7px;height:7px;border-radius:50%;background:#8ea1bf;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.25;transform:translateY(-3px)}}.tools{display:flex;gap:5px;margin-top:8px}.tools button{font-size:11px;background:#091322;border:1px solid #1d304c;color:#91a2bb;border-radius:7px;padding:5px 7px}.composer{position:fixed;left:270px;right:0;bottom:0;padding:18px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 25%)}.compose{max-width:900px;margin:auto;border:1px solid #29405f;background:#0c1728;border-radius:19px;display:flex;align-items:flex-end;gap:7px;padding:8px;box-shadow:0 10px 40px #0008}.compose textarea{flex:1;min-width:0;resize:none;max-height:160px;background:transparent;border:0;outline:0;color:#fff;padding:9px;line-height:1.4}.round{width:42px;height:42px;border-radius:13px;border:1px solid var(--border);background:#101f35;color:#dbe6f8}.send{background:linear-gradient(135deg,#6b5cff,#22d5ff);border:0;color:#fff;font-size:18px}.status{max-width:900px;margin:6px auto 0;color:#73839a;font-size:11px;text-align:center}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.panel{width:min(470px,100%);background:#0d1829;border:1px solid #2a4161;border-radius:20px;padding:20px;box-shadow:0 20px 70px #000c}.panel h2{margin:0 0 5px}.panel p{color:var(--muted);font-size:13px}.row{margin:16px 0}.row label{display:block;color:#9eacc1;font-size:12px;margin-bottom:7px}.row select{width:100%;padding:11px;border-radius:10px;background:#091423;border:1px solid var(--border);color:#fff}.modal-actions{display:flex;gap:8px;justify-content:flex-end}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;background:#16243a;border:1px solid #345074;color:#e8effa;padding:9px 13px;border-radius:10px;z-index:30;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){.sidebar{position:fixed;z-index:15;top:0;bottom:0;left:0;transform:translateX(-105%);transition:.2s;box-shadow:15px 0 50px #000b}.sidebar.open{transform:none}.mobile-menu{display:block}.composer{left:0}.top{height:58px}.topactions .hide-mobile{display:none}.wrap{padding:18px 12px 145px}.welcome{padding-top:5vh}.welcome h1{font-size:30px}.grid{grid-template-columns:1fr}.bubble{max-width:91%}}
@media(min-width:761px){#overlay{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="/icon.svg" alt="Astra logo"><div><b>Astra 10</b><small>AI assistant · Devesh Tiwari</small></div></div>
    <button class="newchat" id="newChat">＋ New chat</button>
    <div class="history-title">Recent chats</div>
    <div class="history" id="history"></div>
    <div class="sidebottom">
      <button class="sidebtn" id="exportBtn">⇩ Export current chat</button>
      <button class="sidebtn" id="settingsBtn">⚙ Settings</button>
      <button class="sidebtn" id="clearAll">⌫ Clear history</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="topbrand"><button class="btn mobile-menu" id="menu">☰</button><img src="/icon.svg" alt="Astra"><div><b>Astra 10</b><br><span id="serverText">Checking server…</span></div></div>
      <div class="topactions"><button class="btn" id="webBtn">⌁ Web OFF</button><button class="btn hide-mobile" id="installBtn" style="display:none">⬇ Install</button><button class="btn" id="topNew">＋ New</button></div>
    </header>
    <section class="chat" id="chat"><div class="wrap"><section class="welcome" id="welcome"><img class="hero-logo" src="/icon.svg" alt="Astra 10 logo"><h1>How can I help?</h1><p>Chat · Code · Study · Write · Search · Plan</p><div class="chips"><button class="chip" data-p="Explain this in simple Hindi: how does the internet work?">Hindi explain</button><button class="chip" data-p="Explain this in Hinglish with a simple example.">Hinglish</button><button class="chip" data-p="Help me build a modern responsive website step by step.">Build website</button><button class="chip" data-p="Give me a practical coding roadmap for a beginner.">Learn coding</button></div><div class="grid"><button class="card" data-p="Explain a difficult topic simply with an example."><strong>🧠 Explain anything</strong><small>Simple, clear, step-by-step answers.</small></button><button class="card" data-p="Write a professional message for me."><strong>✍️ Write for me</strong><small>Messages, applications, captions and more.</small></button><button class="card" data-p="Help me debug my code. Tell me what to check first."><strong>💻 Code with Astra</strong><small>Build and troubleshoot projects.</small></button><button class="card" data-p="Search the latest AI news and summarize the important points."><strong>🌐 Search the web</strong><small>Turn Web ON for current information.</small></button></div></section><div id="messages"></div></div></section>
  </main>
  <div class="composer"><div class="compose"><button class="round" id="voice" title="Voice input">🎙</button><textarea id="input" rows="1" placeholder="Message Astra…"></textarea><button class="round" id="stop" title="Stop" style="display:none">■</button><button class="round send" id="send" title="Send">➤</button></div><div class="status" id="status">Ready</div></div>
</div>
<div class="modal" id="modal"><div class="panel"><h2>Astra Settings</h2><p>Customize your Astra 10 experience.</p><div class="row"><label>Response language</label><select id="lang"><option value="auto">Auto — same language as me</option><option value="English">English</option><option value="Hindi">Hindi</option><option value="Hinglish">Hinglish</option></select></div><div class="row"><label>About</label><div style="padding:12px;border:1px solid var(--border);border-radius:10px;color:#aab8cc;font-size:13px">Astra 10 · v10.0.0<br>Developed by Devesh Tiwari</div></div><div class="modal-actions"><button class="btn" id="closeModal">Close</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const input=$('input'),send=$('send'),stop=$('stop'),status=$('status'),messagesEl=$('messages'),welcome=$('welcome'),chat=$('chat'),historyEl=$('history'),toast=$('toast');
let chats=[],activeId=null,busy=false,web=false,controller=null,deferredPrompt=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(){try{chats=JSON.parse(localStorage.getItem('astra_chats')||'[]')}catch{chats=[]}if(!Array.isArray(chats))chats=[];activeId=chats[0]?.id||null;if(activeId)renderChat();else newChat(false);renderHistory()}
function persist(){localStorage.setItem('astra_chats',JSON.stringify(chats.slice(0,30)))}
function current(){return chats.find(c=>c.id===activeId)}
function newChat(save=true){const c={id:uid(),title:'New chat',messages:[],updated:Date.now()};chats.unshift(c);activeId=c.id;if(save)persist();renderChat();renderHistory();input.focus();status.textContent='New chat ready'}
function renderHistory(){historyEl.innerHTML='';for(const c of chats.slice(0,20)){const b=document.createElement('button');b.textContent=c.title||'New chat';b.onclick=()=>{activeId=c.id;renderChat();renderHistory();$('sidebar').classList.remove('open')};historyEl.appendChild(b)}}
function escText(s){return String(s)}
function addBubble(role,text,typing=false){const row=document.createElement('div');row.className='msg '+role;const av=document.createElement('div');av.className='avatar';if(role==='assistant'){const im=document.createElement('img');im.src='/icon.svg';im.alt='Astra';av.appendChild(im)}else av.textContent='🙂';const b=document.createElement('div');b.className='bubble';if(typing){b.innerHTML='<div class="typing"><i></i><i></i><i></i></div>'}else b.textContent=escText(text);row.appendChild(av);row.appendChild(b);messagesEl.appendChild(row);chat.scrollTop=chat.scrollHeight;return b}
function toolButtons(b,text){const t=document.createElement('div');t.className='tools';const copy=document.createElement('button');copy.textContent='Copy';copy.onclick=async()=>{try{await navigator.clipboard.writeText(text);showToast('Copied')}catch{showToast('Copy unavailable')}};t.appendChild(copy);const again=document.createElement('button');again.textContent='Regenerate';again.onclick=()=>regenerate();t.appendChild(again);b.appendChild(t)}
function renderChat(){const c=current();messagesEl.innerHTML='';welcome.style.display=c&&c.messages.length?'none':'';if(!c)return;for(const m of c.messages){const b=addBubble(m.role,m.content);if(m.role==='assistant')toolButtons(b,m.content)}}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1800)}
async function ask(text){if(busy)return;if(!text)return;const c=current()||newChat();busy=true;send.disabled=true;stop.style.display='block';input.value='';input.style.height='auto';welcome.style.display='none';c.messages.push({role:'user',content:text});if(c.messages.length===1)c.title=text.slice(0,42);c.updated=Date.now();persist();renderHistory();addBubble('user',text);status.textContent='Astra is thinking…';const b=addBubble('assistant','',true);try{controller=new AbortController();const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.messages,language:$('lang').value,webSearch:web}),signal:controller.signal});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||`Server error ${r.status}`);const answer=data.text||'No response received.';b.textContent=answer;toolButtons(b,answer);c.messages.push({role:'assistant',content:answer});c.updated=Date.now();persist();status.textContent='Ready'}catch(e){if(e.name==='AbortError'){b.textContent='⏹ Response stopped.';status.textContent='Stopped'}else{b.textContent='⚠ '+e.message;status.textContent='Request failed — check the server/API configuration'}}finally{busy=false;controller=null;send.disabled=false;stop.style.display='none';input.focus();chat.scrollTop=chat.scrollHeight}}
function regenerate(){const c=current();if(!c||busy)return;const last=c.messages[c.messages.length-1];if(!last||last.role!=='assistant'){showToast('Nothing to regenerate');return}c.messages.pop();const user=c.messages[c.messages.length-1];if(!user){renderChat();return}persist();renderChat();ask(user.content)}
function submit(){const t=input.value.trim();if(t)ask(t)}
send.onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'});
$('newChat').onclick=()=>newChat();$('topNew').onclick=()=>newChat();$('menu').onclick=()=>$('sidebar').classList.toggle('open');$('webBtn').onclick=()=>{web=!web;$('webBtn').textContent='⌁ Web '+(web?'ON':'OFF');$('webBtn').classList.toggle('on',web);status.textContent=web?'Web search enabled':'Web search disabled'};$('stop').onclick=()=>controller?.abort();
document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{input.value=x.dataset.p;input.dispatchEvent(new Event('input'));submit()});
$('settingsBtn').onclick=()=>$('modal').classList.add('show');$('closeModal').onclick=()=>$('modal').classList.remove('show');$('clearAll').onclick=()=>{if(confirm('Clear all Astra chat history?')){chats=[];activeId=null;persist();newChat();showToast('History cleared')}};
$('exportBtn').onclick=()=>{const c=current();if(!c||!c.messages.length){showToast('No messages to export');return}const text=c.messages.map(m=>(m.role==='user'?'YOU':'ASTRA')+'\n'+m.content).join('\n\n');const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astra-chat.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voice').style.display='none'}else{$('voice').onclick=()=>{const r=new SR();const l=$('lang').value;r.lang=l==='Hindi'?'hi-IN':l==='English'?'en-IN':'en-IN';r.interimResults=false;r.onstart=()=>status.textContent='Listening…';r.onresult=e=>{input.value=e.results[0][0].transcript;input.dispatchEvent(new Event('input'));submit()};r.onerror=()=>status.textContent='Voice input unavailable';r.onend=()=>{if(!busy)status.textContent='Ready'};r.start()}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').style.display='block'});$('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').style.display='none'};
async function check(){try{const r=await fetch('/api/status',{cache:'no-store'});const s=await r.json();if(s.configured){$('serverText').textContent='● Server connected · '+s.model;status.textContent='Ready'}else{$('serverText').textContent='● Server online · API key missing';status.textContent='⚠ Add OPENAI_API_KEY in Vercel'} }catch{$('serverText').textContent='● Server not reachable';status.textContent='⚠ Open Astra through the deployed site/server'}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});load();check();
</script>
</body></html>
